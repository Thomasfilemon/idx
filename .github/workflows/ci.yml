name: CI

on:
  push:
    branches: [main, development]
  workflow_dispatch:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo run -- --help
      - run: cargo run --bin idx -- --help
      - run: cargo test --bin idx-api

  web:
    name: web (node tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/test/*.mjs
      - name: npm launchers (ihsg-cli, ihsg-mcp)
        run: node --test npm/test/*.mjs
      - run: node --check web/src/worker.js
      - name: Versions agree (Cargo.toml, package.json, npm/package.json, npm-mcp/package.json)
        run: |
          cargo_ver="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          root_ver="$(node -p "require('./package.json').version")"
          npm_ver="$(node -p "require('./npm/package.json').version")"
          mcp_ver="$(node -p "require('./npm-mcp/package.json').version")"
          echo "Cargo.toml $cargo_ver · package.json $root_ver · npm/package.json $npm_ver · npm-mcp/package.json $mcp_ver"
          [ "$cargo_ver" = "$root_ver" ] && [ "$cargo_ver" = "$npm_ver" ] && [ "$cargo_ver" = "$mcp_ver" ] || { echo "versions differ: bump all four together"; exit 1; }

  dashboard-browser:
    name: dashboard browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python web/test/dashboard-browser.py --chrome "$(command -v google-chrome)" --screenshots dashboard-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: dashboard-screenshots/
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t thomas-idx-api .
      - name: Verify container liveness
        run: |
          docker run -d --name idx-api thomas-idx-api
          trap 'docker logs idx-api; docker rm -f idx-api' EXIT
          docker exec idx-api curl -fsS --retry 10 --retry-connrefused --max-time 2 http://127.0.0.1:8000/healthz
